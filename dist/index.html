<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5ddfd">
  <meta name="description" content="Plan a class pizza party in a hands-on Secondary 1 math activity with Allo, your step-by-step learning guide.">
  <title>Pizza Party Planner | Alloprof Activity Studio</title>
  <link rel="icon" type="image/svg+xml" href="./assets/guide.svg">
  <link rel="preload" href="./assets/chromatica-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#work" id="skip">Skip to the activity</a>
  <header id="header"></header>
  <main class="wrap" id="main">
    <nav class="breadcrumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <section class="hero" aria-labelledby="page-title">
      <div id="hero-info" class="hero-info"></div>
      <div class="hero-art"><img src="./assets/pizza-truck.webp" alt="" width="1024" height="683"></div>
    </section>
    <div class="activity-grid">
      <div class="column">
        <section id="mission" class="mission panel"></section>
        <section id="work" class="workspace panel" tabindex="-1" aria-labelledby="work-title"></section>
      </div>
      <aside class="side">
        <section id="progress" class="progress panel"></section>
        <section id="coach-invite" class="coach-invite"></section>
      </aside>
    </div>
  </main>
  <footer class="wrap" id="footer"></footer>
  <div id="guide-slot"></div>
  <div id="launcher-slot"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="notice" role="status" class="sr-only"></div>
</body>
</html>
